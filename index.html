<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufbau">
<meta name="theme-color" content="#08090B">
<meta name="robots" content="noindex">
<title>Aufbau</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App, feste Glas-Tab-Leiste unten.
   Instrumenten-Look in Graphit + Eisblau, bewusst nur dunkel. */
:root {
  color-scheme: dark;
  --bg:#08090B; --s1:#101215; --s2:#15181C; --s3:#1C2026; --s4:#252A31;
  --line:rgba(255,255,255,.055); --line2:rgba(255,255,255,.09); --line3:rgba(255,255,255,.16);
  --ink:#ECEEF1; --ink2:#A2A9B2; --ink3:#69717B; --ink4:#434A53;
  --ice:#8ECFFF; --ice2:#5BB4F5; --ice-a:rgba(142,207,255,.13); --ice-glow:rgba(91,180,245,.35);
  --good:#7BE0AE; --good-a:rgba(123,224,174,.12);
  --warn:#F3C77A; --warn-a:rgba(243,199,122,.12);
  --bad:#FF8E80; --bad-a:rgba(255,142,128,.12);
  --f:"Geist", ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --fm:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:22px;
}
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--f);
  font-feature-settings:"tnum" 1, "ss01" 1; -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
.glow { position:fixed; inset:0 0 auto; height:420px; pointer-events:none; z-index:0;
  background:radial-gradient(80% 70% at 50% -10%, rgba(91,180,245,.10), transparent 70%); }
button, input, select, textarea { font:inherit; color:inherit; }
button { background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:1.5px solid var(--ice); outline-offset:2px; }
svg { display:block; }
[hidden] { display:none !important; }

html, body { overscroll-behavior-y:none; }
button, label.btn, .chip, .fav, .tab { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.app { position:relative; z-index:1; max-width:480px; margin:0 auto;
  padding-top:calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Tab-Leiste ---------- */
.tabbar { position:fixed; z-index:20; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  left:50%; transform:translateX(-50%); width:min(456px, calc(100% - 20px)); height:66px; border-radius:24px;
  background:rgba(20,23,27,.8); -webkit-backdrop-filter:blur(22px) saturate(1.4); backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--line2); display:grid; grid-template-columns:repeat(4,1fr); padding:0 6px; }
.tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:var(--ink3);
  font-size:10.5px; font-weight:500; position:relative; }
.tab svg { width:22px; height:22px; }
.tab.on { color:var(--ink); }
.tab.on::after { content:""; position:absolute; top:6px; width:4px; height:4px; border-radius:2px; background:var(--ice); box-shadow:0 0 10px var(--ice); }

/* ---------- Grundbausteine ---------- */
.hd { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:6px 2px 18px; }
.hd .k { font-family:var(--fm); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); }
.hd h1 { margin:4px 0 0; font-size:30px; font-weight:400; letter-spacing:-.035em; line-height:1.05; }
.hd-r { display:flex; align-items:center; gap:8px; }
.sync { display:flex; align-items:center; gap:7px; font-family:var(--fm); font-size:10px; color:var(--ink3); letter-spacing:.08em; text-transform:uppercase; }
.sync i { width:6px; height:6px; border-radius:3px; background:var(--good); box-shadow:0 0 8px var(--good); }
.sync.off i { background:var(--warn); box-shadow:0 0 8px var(--warn); }
.icbtn { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--s1); border:1px solid var(--line); color:var(--ink2); }

.card { position:relative; background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,.008)), var(--s1);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:inset 0 1px 0 rgba(255,255,255,.035); }
.stack { display:flex; flex-direction:column; gap:10px; }
.pad { padding:16px; }
.lbl { font-family:var(--fm); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink3); }
.grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.big { font-weight:250; letter-spacing:-.045em; line-height:.95; }
.unit { font-size:12px; color:var(--ink3); font-weight:400; letter-spacing:0; margin-left:3px; }
.row { display:flex; align-items:center; gap:10px; }
.sp { flex:1; min-width:0; }
.sec { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 4px 10px; }
.sec h2 { margin:0; font-size:13px; font-weight:500; color:var(--ink2); }
.sec .lbl { font-size:9.5px; }
.sec button.lbl { color:var(--ice); }
.pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--fm); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  padding:5px 10px; border-radius:99px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap; }
.pill.ice { color:var(--ice); border-color:rgba(142,207,255,.28); background:var(--ice-a); }
.pill.good { color:var(--good); border-color:rgba(123,224,174,.25); background:var(--good-a); }
.pill.warn { color:var(--warn); border-color:rgba(243,199,122,.25); background:var(--warn-a); }
.seg { height:3px; border-radius:2px; background:var(--s4); overflow:hidden; }
.seg i { display:block; height:100%; border-radius:2px; background:var(--ice); transition:width .4s cubic-bezier(.2,.7,.3,1); }
.seg i.g { background:var(--good); } .seg i.w { background:var(--warn); }
.btn { height:40px; padding:0 15px; border-radius:12px; font-size:13.5px; font-weight:500; border:1px solid var(--line2); color:var(--ink2); background:var(--s2); }
.btn.pri { background:var(--ink); color:#0B0D10; border-color:var(--ink); font-weight:600; }
.btn.full { width:100%; }
.btn.danger { color:var(--bad); border-color:rgba(255,142,128,.25); background:var(--bad-a); }
.empty { padding:22px 18px; text-align:center; color:var(--ink3); font-size:13px; line-height:1.6; border:1px dashed var(--line2); border-radius:var(--r); }
.empty b { display:block; color:var(--ink2); font-weight:500; font-size:14px; margin-bottom:4px; }
.note { font-size:12px; color:var(--ink3); line-height:1.55; margin:10px 4px 0; }

/* ---------- Heute ---------- */
.gauge { padding:14px 12px 16px; overflow:hidden; }
.gauge::before { content:""; position:absolute; left:50%; top:118px; width:240px; height:240px; transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(91,180,245,.16), transparent); pointer-events:none; }
.gauge-box { width:100%; max-width:300px; margin:0 auto; position:relative; }
.gauge-num { position:absolute; left:0; right:0; top:39%; text-align:center; }
.gauge-num .big { font-size:76px; }
.gauge-num .big small { font-size:26px; font-weight:300; color:var(--ink3); margin-left:2px; letter-spacing:-.02em; }
.gauge-num .lbl { margin-top:8px; display:block; }
.gauge-say { text-align:center; font-size:13.5px; color:var(--ink2); line-height:1.5; margin:-6px auto 14px; max-width:32ch; position:relative; }
.gauge-say b { color:var(--ink); font-weight:500; }
.parts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; position:relative; }
.part { padding:10px 9px 9px; border-radius:12px; background:rgba(255,255,255,.022); border:1px solid var(--line); min-width:0; }
.part .lbl { font-size:8.5px; letter-spacing:.11em; }
.part .v { font-size:17px; font-weight:400; letter-spacing:-.03em; margin:5px 0 7px; white-space:nowrap; }
.part .v span { font-size:10.5px; color:var(--ink3); margin-left:2px; letter-spacing:0; }
.metric .big { font-size:32px; margin-top:10px; white-space:nowrap; }
.metric .spark { margin-top:12px; height:38px; width:100%; }
.metric .foot { display:flex; justify-content:space-between; gap:6px; margin-top:9px; font-family:var(--fm); font-size:9.5px; color:var(--ink3); letter-spacing:.05em; }
.next { display:flex; align-items:center; gap:14px; }
.next .ic { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:var(--ice-a);
  border:1px solid rgba(142,207,255,.22); color:var(--ice); flex:0 0 auto; }
.next .t { font-size:17px; font-weight:500; letter-spacing:-.02em; }
.next .s { font-size:12.5px; color:var(--ink2); margin-top:2px; }
.water { display:flex; gap:5px; margin-top:12px; }
.water button { flex:1; height:30px; border-radius:8px; background:var(--s3); border:1px solid var(--line); position:relative; overflow:hidden; }
.water button.f::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, var(--ice), var(--ice2)); opacity:.9; }
.supps { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.supp { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; padding:7px 11px 7px 8px; border-radius:11px;
  background:var(--s2); border:1px solid var(--line); color:var(--ink2); }
.supp i { width:16px; height:16px; border-radius:5px; border:1.5px solid var(--ink4); display:grid; place-items:center; }
.supp.on { color:var(--ink); border-color:rgba(123,224,174,.22); background:var(--good-a); }
.supp.on i { background:var(--good); border-color:var(--good); }
.supp.on i::after, .ok-mark::after { content:""; width:6px; height:3px; border:solid #0B0D10; border-width:0 0 1.6px 1.6px; transform:rotate(-45deg) translate(1px,-1px); }
.supp small { color:var(--ink3); font-size:11px; }
.stepper { display:flex; align-items:center; gap:6px; }
.stepper button { width:34px; height:34px; border-radius:10px; background:var(--s3); border:1px solid var(--line); font-family:var(--fm); color:var(--ink2); }
.stepper .val { min-width:64px; text-align:center; font-family:var(--fm); font-size:14px; }

/* ---------- Training ---------- */
.chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.chips::-webkit-scrollbar { display:none; }
.chip { font-size:12.5px; font-weight:500; padding:8px 13px; border-radius:11px; background:var(--s1); border:1px solid var(--line); color:var(--ink2); white-space:nowrap; position:relative; }
.chip.on { background:var(--ink); color:#0B0D10; border-color:var(--ink); }
.chip.ghost { color:var(--ink3); }
.chip .dot { position:absolute; top:5px; right:5px; width:5px; height:5px; border-radius:3px; background:var(--ice); }
.chip.on .dot { background:#0B5C99; }
.daysel { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
.daysel .chip { text-align:center; padding:10px 6px; }
.lift { padding:18px 16px 16px; }
.lift-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.lift-name { font-size:22px; font-weight:500; letter-spacing:-.035em; }
.lift-sub { font-size:12.5px; color:var(--ink2); margin-top:3px; }
.dial { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:6px; margin:22px 0 6px; }
.dial .col { text-align:center; }
.dial .big { font-size:64px; }
.dial .x { font-size:24px; color:var(--ink4); font-weight:200; padding-bottom:10px; }
.steps { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; }
.steps button { height:44px; border-radius:12px; background:var(--s3); border:1px solid var(--line); font-family:var(--fm); font-size:13px; color:var(--ink2); }
.steps button:active { background:var(--s4); color:var(--ink); }
.hint { display:flex; gap:10px; align-items:flex-start; margin-top:14px; padding:11px 12px; border-radius:12px; background:var(--ice-a); border:1px solid rgba(142,207,255,.16); }
.hint svg { flex:0 0 auto; color:var(--ice); margin-top:1px; }
.hint p { margin:0; font-size:12.5px; line-height:1.5; color:var(--ink2); }
.hint p b { color:var(--ink); font-weight:500; }
.hint.good { background:var(--good-a); border-color:rgba(123,224,174,.18); } .hint.good svg { color:var(--good); }
.done { margin-top:14px; width:100%; height:56px; border-radius:16px; background:linear-gradient(180deg, #A3D9FF, var(--ice2));
  color:#06121D; font-weight:600; font-size:16px; letter-spacing:-.015em; box-shadow:0 10px 30px -10px var(--ice-glow), inset 0 1px 0 rgba(255,255,255,.4); }
.done:active { transform:scale(.985); }
.done.alt { background:var(--s3); color:var(--ink); box-shadow:none; border:1px solid var(--line2); }
.sets { margin-top:18px; border-top:1px solid var(--line); }
.set { display:grid; grid-template-columns:22px 1fr 1fr 28px; align-items:center; gap:8px; padding:11px 2px; border-bottom:1px solid var(--line); font-family:var(--fm); font-size:13.5px; }
.set.head { color:var(--ink3); font-size:9.5px; letter-spacing:.1em; padding:8px 2px; }
.set .n { color:var(--ink3); font-size:11px; }
.set .prev { color:var(--ink3); }
.set .ok { width:22px; height:22px; border-radius:11px; display:grid; place-items:center; justify-self:end; }
.set.isdone .ok { background:var(--good); }
.set.isdone .ok::after { content:""; width:7px; height:3.5px; border:solid #0B0D10; border-width:0 0 1.7px 1.7px; transform:rotate(-45deg) translate(1px,-1px); }
.set.cur { color:var(--ice); }
.set.cur .ok { border:1.5px solid var(--ice); box-shadow:0 0 0 3px var(--ice-a); }
.set.todo { color:var(--ink4); } .set.todo .ok { border:1.5px solid var(--ink4); }
.queue .q { display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:12px; align-items:center; padding:13px 16px; border-top:1px solid var(--line); width:100%; text-align:left; }
.queue .q:first-child { border-top:0; }
.queue .dot { width:8px; height:8px; border-radius:4px; border:1.5px solid var(--ink4); }
.queue .dot.on { background:var(--ice); border-color:var(--ice); box-shadow:0 0 8px var(--ice-glow); }
.queue .dot.fin { background:var(--good); border-color:var(--good); }
.queue .nm { font-size:14px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.queue .pv { font-family:var(--fm); font-size:11.5px; color:var(--ink3); }
.rest { position:fixed; z-index:19; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);
  width:min(456px, calc(100% - 20px)); border-radius:18px; padding:10px 12px; display:flex; align-items:center; gap:12px;
  background:rgba(28,32,38,.88); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); border:1px solid var(--line2); }
.rest .ring { position:relative; width:40px; height:40px; flex:0 0 auto; }
.rest .ring span { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--fm); font-size:10.5px; }
.rest .t { font-size:14px; font-weight:500; }
.rest .s { font-size:11.5px; color:var(--ink3); margin-top:1px; }
.rest .btn { height:34px; padding:0 11px; font-size:12px; }
.cardio-form { display:grid; grid-template-columns:1.3fr 1fr 1fr auto; gap:6px; margin-top:12px; }
.field { width:100%; min-width:0; height:40px; border-radius:11px; background:var(--s2); border:1px solid var(--line2); padding:0 11px; font-size:14px; }
select.field { appearance:none; -webkit-appearance:none; }
.list .li { display:grid; grid-template-columns:minmax(0,1fr) auto 30px; gap:10px; align-items:center; padding:11px 16px; border-top:1px solid var(--line); }
.list .li:first-child { border-top:0; }
.list .li .nm { font-size:14px; }
.list .li .nm small { display:block; font-size:11.5px; color:var(--ink3); margin-top:1px; }
.list .li .kc { font-family:var(--fm); font-size:12.5px; text-align:right; }
.list .li .kc small { display:block; color:var(--ink3); font-size:10.5px; }
.list .li.tm3 { grid-template-columns:44px minmax(0,1fr) auto 30px; }
.list .tm { font-family:var(--fm); font-size:11px; color:var(--ink3); }
.x { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--ink4); }
.x:hover { color:var(--ink2); background:var(--s3); }

/* ---------- Essen ---------- */
.sum { display:flex; align-items:flex-end; gap:18px; }
.sum .big { font-size:46px; white-space:nowrap; }
.bars { flex:1; display:flex; flex-direction:column; gap:8px; padding-bottom:4px; min-width:0; }
.bars .r { display:grid; grid-template-columns:58px minmax(0,1fr) 68px; gap:8px; align-items:center; font-family:var(--fm); font-size:10px; color:var(--ink3); letter-spacing:.04em; }
.bars .r span:last-child { text-align:right; color:var(--ink2); }
.ask { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; border-radius:18px; background:var(--s2); border:1px solid var(--line2); }
.ask input { flex:1; min-width:0; background:none; border:0; font-size:15px; height:40px; outline:none; }
.ask input::placeholder { color:var(--ink3); }
.ask .send { width:40px; height:40px; border-radius:13px; display:grid; place-items:center; background:var(--ink); color:#0B0D10; flex:0 0 auto; }
.ask-hint { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink3); margin:8px 6px 0; }
.est { margin-top:10px; padding:14px 14px 12px; border-color:rgba(142,207,255,.2); }
.est .q { font-size:14px; color:var(--ink); margin-top:8px; }
.est .q i { color:var(--ink3); font-style:normal; }
.est .as { font-size:12px; color:var(--ink3); margin-top:4px; }
.macros { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:12px; }
.macros label { padding:8px 9px; border-radius:10px; background:rgba(255,255,255,.025); border:1px solid var(--line); display:block; min-width:0; }
.macros input { width:100%; background:none; border:0; padding:0; margin-top:3px; font-size:16px; letter-spacing:-.03em; outline:none; }
.acts { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.acts .pri { flex:1; }
.thinking { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink2); }
.thinking i { width:14px; height:14px; border-radius:7px; border:2px solid var(--ice-a); border-top-color:var(--ice); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.favs { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
.fav { text-align:left; padding:13px 13px 12px; border-radius:16px; background:var(--s1); border:1px solid var(--line); position:relative; transition:transform .12s, border-color .2s; min-width:0; }
.fav:active { transform:scale(.97); }
.fav .nm { font-size:13.5px; font-weight:500; letter-spacing:-.01em; padding-right:24px; }
.fav .mc { font-family:var(--fm); font-size:10.5px; color:var(--ink3); margin-top:5px; }
.fav .badge { position:absolute; top:11px; right:11px; width:20px; height:20px; border-radius:7px; display:grid; place-items:center; background:var(--s3); color:var(--ink2); }
.fav.hit { border-color:rgba(123,224,174,.4); }
.fav.hit .badge { background:var(--good); color:#0B0D10; }
.fav.edit .badge { background:var(--bad-a); color:var(--bad); }
.fav .cnt { font-family:var(--fm); font-size:9.5px; color:var(--ink4); margin-top:8px; letter-spacing:.06em; text-transform:uppercase; }
.toolrow { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.toolrow .btn { padding:0 8px; font-size:12.5px; }
.tpls { display:flex; gap:6px; flex-wrap:wrap; }

/* ---------- Körper ---------- */
.wt .big { font-size:58px; }
.chart { width:100%; height:190px; margin-top:12px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-family:var(--fm); font-size:10px; color:var(--ink3); letter-spacing:.04em; }

    var w = $("wChart"); if (w) drawWeight(w);
  }
  function drawGauge(g, val) {
    var cx = 150, cy = 140, r = 112, start = 135, sweep = 270; val = Math.max(0, Math.min(1, val));
    var defs = s("defs", {}, g), lg = s("linearGradient", { id: "gArc", x1: "0", y1: "1", x2: "1", y2: "0" }, defs);
    s("stop", { offset: "0", "stop-color": "#4FA6E8" }, lg); s("stop", { offset: "1", "stop-color": "#C4E7FF" }, lg);
    s("feGaussianBlur", { stdDeviation: "6" }, s("filter", { id: "gGlow", x: "-30%", y: "-30%", width: "160%", height: "160%" }, defs));
    function pt(a, rr) { var t = a * Math.PI / 180; return [cx + rr * Math.cos(t), cy + rr * Math.sin(t)]; }
    function arc(a0, a1, rr) { var p0 = pt(a0, rr), p1 = pt(a1, rr); return "M" + p0[0] + " " + p0[1] + " A" + rr + " " + rr + " 0 " + (a1 - a0 > 180 ? 1 : 0) + " 1 " + p1[0] + " " + p1[1]; }

    if (val > 0.005) {
      var end = start + sweep * val;
      s("path", { d: arc(start, end, r), fill: "none", stroke: "url(#gArc)", "stroke-width": 10, "stroke-linecap": "round", filter: "url(#gGlow)", opacity: ".55" }, g);
      s("path", { d: arc(start, end, r), fill: "none", stroke: "url(#gArc)", "stroke-width": 10, "stroke-linecap": "round" }, g);
      var e = pt(end, r);
      s("circle", { cx: e[0], cy: e[1], r: 9, fill: "#C4E7FF", opacity: ".25" }, g);

      var p = pt(l[1], r + 33); s("text", { x: p[0], y: p[1] + 3, "text-anchor": "middle", fill: "#434A53", "font-size": 9, "font-family": "Geist Mono, monospace", "letter-spacing": ".1em" }, g).textContent = l[0];

  function spark(g, data, target, id) {
    var W = 150, H = 38, vals = data.filter(function (v) { return v > 0; });
    if (vals.length < 2) { s("text", { x: 0, y: 24, fill: "#434A53", "font-size": 9, "font-family": "Geist Mono, monospace" }, g).textContent = "ab 2 Tagen"; g.setAttribute("preserveAspectRatio", "xMinYMid meet"); return; }
    var lo = Math.min.apply(null, vals.concat([target])) * .85, hi = Math.max.apply(null, vals.concat([target])) * 1.05;
    function x(i) { return 2 + i * (W - 4) / (data.length - 1); }

    s("stop", { offset: "0", "stop-color": "#8ECFFF", "stop-opacity": ".22" }, gr); s("stop", { offset: "1", "stop-color": "#8ECFFF", "stop-opacity": "0" }, gr);

    s("path", { d: d, fill: "none", stroke: "#8ECFFF", "stroke-width": 1.6, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }, g);

  function drawWeight(g) {
    var W = 330, H = 190, padL = 32, padR = 8, padT = 10, padB = 22;
    var first = shift(today(), -55), pts = weights().filter(function (x) { return x[0] >= first; });
    if (pts.length < 2) return;

    var avg = pts.map(function (p) { var a = pts.filter(function (q) { var dd = daysBetween(q[0], p[0]); return dd >= 0 && dd < 7; }).map(function (q) { return q[1]; }); return [p[0], a.reduce(function (x, y) { return x + y; }, 0) / a.length]; });

        editCfg(function (cc) {
          var prev = cc.ex[newId] || { start: {} };
          cc.ex[newId] = { name: nm, sets: sets, lo: lo, hi: hi, inc: inc || null, start: prev.start || {} };
          if (!id) { cc.plan[ui.gym] = cc.plan[ui.gym] || { push: [], pull: [], legs: [] }; cc.plan[ui.gym][ui.day].push(newId); }
        });
        if (!id) { ui.active = newId; ui.kg = null; }
        closeSheet(); render(); return;
      }
      case "gym": {
        var gn = $("gName").value.trim(); if (!gn) return;
        var gid = uid("g");
        editCfg(function (cc) { cc.gyms.order.push(gid); cc.gyms.names[gid] = gn; cc.plan[gid] = { push: [], pull: [], legs: [] }; });
        ui.gym = gid; ui.active = null; saveUi(); closeSheet(); render(); return;
      }
      case "tpl": {
        var tn = $("tplName").value.trim(); if (!tn) return;
        var items = (day(today()).food || []).map(function (q) { return { name: q.name, kcal: q.kcal, p: q.p, f: q.f, c: q.c }; });
        editCfg(function (cc) { cc.tpls.push({ id: uid("t"), name: tn, items: items }); });
        closeSheet(); toast("Vorlage „" + tn + "“ gespeichert"); return;
      }
      case "weigh": {
        var wv = num($("wIn").value); if (!wv || wv < 35 || wv > 200) { toast("Gib dein Gewicht in kg an, etwa 71,4"); return; }
        editDay(today(), function (d) { d.weight = Math.round(wv * 10) / 10; }); closeSheet(); toast(kg(Math.round(wv * 10) / 10) + " kg gespeichert"); return;
      }
      case "targets": {
        editCfg(function (cc) {
          var t = cc.targets;
          t.kcal = Math.round(num($("tK").value) || t.kcal); t.p = Math.round(num($("tP").value) || t.p); t.f = Math.round(num($("tF").value) || t.f);
          t.water = num($("tW").value) || t.water; t.sleep = num($("tS").value) || t.sleep; t.goal = num($("tG").value) || t.goal;
        });
        closeSheet(); toast("Ziele gespeichert"); return;
      }
      case "supp": {
        var sn = $("sName").value.trim(); if (!sn) return;
        editCfg(function (cc) { cc.supps.push({ id: uid("s"), name: sn, every: +$("sEvery").value }); });
        sheetSettings(); return;
      }
    }
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "closeSheet" && ev.target !== el) return;
    act(a, el.getAttribute("data-v"), el);
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target.closest("[data-form]"); if (!f) return;
    ev.preventDefault(); onForm(f.getAttribute("data-form"), f);
  });
  document.addEventListener("input", function (ev) { if (ev.target.id === "ask") ui.ask = ev.target.value; });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && $("sheetHost").innerHTML) closeSheet(); });

  /* Tageswechsel um Mitternacht: neu zeichnen */
  var lastDay = today();
  setInterval(function () { if (today() !== lastDay) { lastDay = today(); ui.active = null; ui.kg = null; render(); } }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { if (today() !== lastDay) { lastDay = today(); ui.active = null; ui.kg = null; } render(); flush(); } });

  /* ==================== START ==================== */

  document.addEventListener("change", function (ev) {
    if (ev.target.id !== "impFile" || !ev.target.files[0]) return;
    var r = new FileReader();
    r.onload = function () { try { importDocs(JSON.parse(r.result)); closeSheet(); } catch (e) { toast("Die Datei lässt sich nicht lesen."); } };
    r.readAsText(ev.target.files[0]);
  });
  document.addEventListener("input", function (ev) { if (ev.target.id === "pG" && ui.pick) { ui.pick.g = Math.max(0, num(ev.target.value) || 0); $("pM").innerHTML = pickCells(pickMacros()); } });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && sb && user && navigator.onLine) loadAll(); });

  render();
  boot();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
